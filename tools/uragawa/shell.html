<title>「送るだけ」の裏側</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{--bg:#fbf7f0;--surface:#ffffff;--ink:#1f2a37;--muted:#5b6672;--navy:#1c4b7d;--deep:#14375c;--orange:#c8721c;--line:#e3d9c8;--navy-soft:#dfe9f5;--bar:#1c4b7d;--grey:#b8bec6;--focus:#c8721c}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131c27;--surface:#1b2735;--ink:#eef2f6;--muted:#a9b6c5;--navy:#8fbdf0;--deep:#dbe7f5;--orange:#e69a4a;--line:#2c3b4d;--navy-soft:#263a52;--bar:#2f5f92;--grey:#55606c}}
  :root[data-theme="dark"]{--bg:#131c27;--surface:#1b2735;--ink:#eef2f6;--muted:#a9b6c5;--navy:#8fbdf0;--deep:#dbe7f5;--orange:#e69a4a;--line:#2c3b4d;--navy-soft:#263a52;--bar:#2f5f92;--grey:#55606c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;line-height:1.85}
  a{color:var(--navy)}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .page{max-width:900px;margin:0 auto;padding:40px 22px 80px}
  .hd,section,.ft{max-width:720px}
  .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h1{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(2rem,5vw,3rem);line-height:1.25;color:var(--deep);margin:0 0 16px;text-wrap:balance;letter-spacing:.02em}
  h2{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-size:1.45rem;color:var(--deep);margin:56px 0 12px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
  .lede{font-size:1.08rem;margin:0 0 24px}
  p{margin:0 0 14px}
  strong{color:var(--deep)}
  .small{font-size:.9rem;color:var(--muted)}
  .stamp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin:8px 0 0;border:2px solid var(--orange);border-radius:4px;overflow:hidden;background:var(--surface)}
  .stamp div{padding:10px 14px;border-right:1px solid var(--line)}
  .stamp div:last-child{border-right:0}
  .stamp dt{font-size:.72rem;letter-spacing:.1em;color:var(--orange);margin:0}
  .stamp dd{margin:0;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums}
  figure{margin:20px 0 8px;max-width:900px}
  figure svg{display:block;width:100%;height:auto;color:var(--ink);font-family:inherit}
  figcaption{font-size:.88rem;color:var(--muted);margin-top:8px;max-width:720px}
  .sv-box{fill:var(--surface);stroke:var(--navy);stroke-width:1.5}
  .sv-box-me{fill:var(--navy-soft)}
  .sv-h{font-size:14px;font-weight:700;fill:var(--ink)}
  .sv-s{font-size:12px;fill:var(--muted)}
  .sv-l{font-size:12.5px;fill:var(--ink)}
  .sv-note{font-size:11.5px;fill:var(--muted)}
  .sv-onink{fill:#fff}
  .f-orange{fill:var(--orange)} .s-orange{stroke:var(--orange)} .f-navy{fill:var(--bar)} .f-navy-soft{fill:var(--navy-soft)} .f-grey{fill:var(--grey)} .f-orange-soft{fill:var(--orange);opacity:.35}
  .sv-tick line{stroke:currentColor;stroke-width:2}
  .tbl-wrap{overflow-x:auto;margin:12px 0}
  table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface)}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:500;border-bottom:2px solid var(--line)}
  .ledger{font-size:.82rem;min-width:820px}
  .three{padding-left:1.4em;margin:8px 0 14px}
  .three li{margin-bottom:6px}
  .valves{margin:12px 0 0;display:grid;gap:10px}
  .valves div{display:grid;grid-template-columns:minmax(160px,220px) 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .valves dt{font-weight:700;color:var(--deep)}
  .valves dd{margin:0}
  .ft{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
  /* ===== 図の部品（すべてHTML+CSS。どの幅でも文字が縮まず折り返す） ===== */
  .dg{margin:18px 0 4px;max-width:900px}
  .dg-cap{font-size:.9rem;color:var(--muted);margin:8px 0 0;max-width:720px}
  .three-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:18px 0 6px}
  .big{background:var(--surface);border-top:4px solid var(--orange);padding:14px 16px}
  .big b{display:block;font-size:1.25rem;color:var(--deep);font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif}
  .big span{font-size:.92rem;color:var(--muted)}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:st}
  .strip div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 44px;position:relative;font-size:.95rem}
  .strip div::before{counter-increment:st;content:counter(st);position:absolute;left:10px;top:9px;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.85rem}
  .strip div b{display:block;color:var(--deep)}
  .strip div small{color:var(--muted)}
  .flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
  .node{background:var(--surface);border:1.5px solid var(--navy);border-radius:8px;padding:12px 10px;text-align:center;display:grid;align-content:center}
  .node.me{background:var(--navy-soft)}
  .node b{display:block;color:var(--deep)}
  .node small{color:var(--muted);font-size:.85rem}
  .gap{display:grid;gap:10px;align-content:center;min-width:96px}
  .arr{display:grid;gap:2px;font-size:.85rem;text-align:center;color:var(--ink)}
  .arr .ln{height:2px;background:currentColor;position:relative;margin:4px 0}
  .arr .ln::after{content:"";position:absolute;top:-4px;right:-1px;border:5px solid transparent;border-left:7px solid currentColor}
  .arr.back .ln::after{right:auto;left:-1px;border-left:5px solid transparent;border-right:7px solid currentColor}
  .arr.money{color:var(--orange);font-weight:700}
  .seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
  .seq .who{font-weight:700;color:var(--deep);min-width:7em}
  .seq .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.92rem}
  .seq .chip.pay{background:var(--orange);color:#fff;border-color:var(--orange)}
  .seq .to{color:var(--muted)}
  .tl{display:flex;height:34px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .tl div{display:grid;place-items:center;font-size:.8rem;white-space:nowrap;overflow:hidden;color:var(--ink)}
  .tl .work{background:var(--navy-soft)} .tl .wait{background:var(--surface)} .tl .sell{background:var(--orange);color:#fff;font-weight:700}
  .tl-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
  .tl-list li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;align-items:baseline;font-size:.95rem}
  .tl-list .d{font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
  .route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 10px;align-items:center}
  .route .it{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:700;color:var(--deep)}
  .route .to{color:var(--muted);font-size:1.2rem;text-align:center}
  .route .dst{background:var(--navy-soft);border-radius:8px;padding:8px 12px;font-size:.95rem}
  .route .dst small{display:block;color:var(--muted);font-size:.82rem}
  .bar{display:flex;height:46px;border-radius:6px;overflow:hidden}
  .bar div{display:grid;place-items:center;font-size:.85rem;overflow:hidden;white-space:nowrap}
  .bar .you{background:var(--bar);color:#fff;font-weight:700;font-size:1rem} .bar .mk{background:var(--grey);color:#fff} .bar .us{background:var(--orange);color:#fff}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.9rem}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}
  .nums div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .nums b{display:block;font-size:1.5rem;color:var(--deep);font-variant-numeric:tabular-nums}
  .nums small{color:var(--muted)}
  .steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;counter-reset:s3}
  .steps3 div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 12px 12px 48px;position:relative}
  .steps3 div::before{counter-increment:s3;content:counter(s3);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;display:grid;place-items:center}
  .steps3 b{display:block;color:var(--deep)}
  .ledger-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
  .ledger-row div{padding:8px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .ledger-row dt{font-size:.75rem;letter-spacing:.08em;color:var(--muted)}
  .ledger-row dd{margin:0;font-weight:700;color:var(--deep);font-size:.95rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .card .if{display:block;color:var(--orange);font-weight:700;font-size:.85rem;letter-spacing:.04em}
  .card .then{display:block;font-weight:700;color:var(--deep);margin:2px 0 4px}
  .card p{margin:0;font-size:.92rem}
  .stairs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:end}
  .stairs div{background:var(--navy-soft);border-radius:8px 8px 0 0;padding:12px 10px;display:grid;align-content:start;gap:2px}
  .stairs div:nth-child(1){min-height:96px} .stairs div:nth-child(2){min-height:136px} .stairs div:nth-child(3){min-height:176px} .stairs div:nth-child(4){min-height:216px}
  .stairs .now{background:var(--orange);color:#fff}
  .stairs b{font-size:.95rem} .stairs .now b{color:#fff} .stairs b{color:var(--deep)}
  .stairs small{font-size:.85rem;color:var(--muted)} .stairs .now small{color:#fff}
  .stairs em{font-style:normal;font-size:.75rem;letter-spacing:.08em;opacity:.8}
  @media (max-width:640px){
    .flow{grid-template-columns:1fr}
    .gap{min-width:0;grid-template-columns:1fr 1fr;padding:2px 0}
    .arr .ln{width:2px;height:26px;margin:2px auto}
    .arr .ln::after{top:auto;bottom:-1px;left:-4px;right:auto;border:5px solid transparent;border-top:7px solid currentColor}
    .arr.back .ln::after{bottom:auto;top:-1px;border:5px solid transparent;border-bottom:7px solid currentColor}
    .tl{display:none}
    .stairs{grid-template-columns:repeat(2,1fr)}
    .stairs div{min-height:0 !important;border-radius:8px}
    .bar div{font-size:.75rem}
  }
  @media (min-width:641px){.tl-list{display:none}}
  .hub-center{margin-bottom:10px;border-width:2px}
  .hub-cards .card{border-top:3px solid var(--orange)}
  .hub-cards p{line-height:1.7}
  /* gate */
  .gate{min-height:60vh;display:grid;place-items:center;padding:40px 22px}
  .gate form{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);padding:28px 26px 24px;display:grid;gap:12px}
  .gate h1{font-size:1.5rem;margin:0}
  .gate p{margin:0;font-size:.92rem;color:var(--muted)}
  .gate input{font:inherit;font-size:1.05rem;padding:10px 12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px}
  .gate button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:4px;background:var(--orange);color:#fff;cursor:pointer}
  .gate .err{color:var(--orange);font-weight:700;min-height:1.4em}
  @media (max-width:560px){.valves div{grid-template-columns:1fr;gap:2px}}
</style>
<div class="gate" id="gate">
  <form id="gate-form" autocomplete="off">
    <p class="eyebrow">ベストプライス ／ 関係者向け</p>
    <h1>「送るだけ」の裏側</h1>
    <p>この説明ページは暗号化されています。共有されたパスワードを入力してください。</p>
    <label for="pw" class="small">パスワード</label>
    <input id="pw" type="password" required autofocus />
    <button type="submit">開く</button>
    <p class="err" id="err" aria-live="polite"></p>
  </form>
</div>
<main class="page" id="main" hidden></main>
<script type="application/json" id="vault">__VAULT__</script>
<script>
(function(){
  var vault = JSON.parse(document.getElementById("vault").textContent);
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  function unlock(pw){
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(km){
      return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(vault.salt), iterations:vault.iter, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    }).then(function(key){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(vault.iv)}, key, b64(vault.ct));
    }).then(function(pt){ return new TextDecoder().decode(pt); });
  }
  var gate = document.getElementById("gate"), main = document.getElementById("main"), err = document.getElementById("err"), form = document.getElementById("gate-form"), input = document.getElementById("pw");
  function show(html, pw){
    main.innerHTML = html; main.hidden = false; gate.hidden = true;
    try { sessionStorage.setItem("bp-explain-pw", pw); } catch(e){}
    window.scrollTo(0,0);
  }
  form.addEventListener("submit", function(ev){
    ev.preventDefault(); err.textContent = "";
    var pw = input.value.trim();
    unlock(pw).then(function(html){ show(html, pw); }).catch(function(){ err.textContent = "パスワードが違います。"; input.select(); });
  });
  try {
    var saved = sessionStorage.getItem("bp-explain-pw");
    if (saved) unlock(saved).then(function(html){ show(html, saved); }).catch(function(){});
  } catch(e){}
})();
</script>
